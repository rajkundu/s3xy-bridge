; S3XY Bridge firmware — ESP32-C6-SuperMini
;
; Aligned with Dorky Commander project structure for future merging.
;
; Environments:
;   esp32-c6    Production firmware (ESP-IDF). `pio run`.

[platformio]
build_cache_dir = .cache
default_envs = esp32-c6

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
upload_speed = 921600
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

[env:esp32-c6]
board = esp32-c6-devkitm-1
framework = espidf

build_flags =
  -U__riscv_misaligned_slow

board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS=sdkconfig.defaults